name: Auto Manga Colorizer Pro

on:
  push:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 سحب الكود والصور
        uses: actions/checkout@v4

      - name: 🐍 إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 تثبيت المكتبات وتجهيز بيئة العمل
        run: |
          python -m pip install --upgrade pip
          # تثبيت المكتبات اللازمة
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
          # تحميل كود المحرك الأساسي من المستودع الأصلي
          git clone https://github.com/jantic/DeOldify.git deoldify_code
          cp -r deoldify_code/deoldify .
          
          # إنشاء المجلدات الضرورية للمحرك
          mkdir -p models
          mkdir -p test_models

      - name: 🎨 تشغيل محرك التلوين الاحترافي المزدوج
        # سيقوم سكربت colorize.py بتحميل المحركين ودمج النتائج تلقائياً
        run: python colorize.py

      - name: 📤 حفظ جميع نتائج التلوين (الفني والمستقر والمدمج)
        uses: actions/upload-artifact@v4
        with:
          name: Colorized_Manga_Results_Package
          # التعديل الجوهري: استخدام النجمة لجلب كل ملفات النتائج
          path: result*.jpg
          if-no-files-found: error
          retention-days: 7

name: Auto Manga Colorizer
on:
  push:
    # سيشتغل عند أي تغيير في أي ملف بالمستودع
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: 📥 سحب الكود والصور
        uses: actions/checkout@v4

      - name: 🐍 إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 📦 تثبيت المكتبات اللازمة
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy

      - name: 📥 جلب ملفات الذكاء الاصطناعي (الروابط المصححة)
        # تم استبدال الروابط لضمان تحميل الملف المصدري وليس صفحة HTML
        run: |
          curl -L -o color.prototxt https://raw.githubusercontent.com/opencv/opencv_3rdparty/f930e6e5a593322b79a556396e944b25451e0655/colorization_deploy_v2.prototxt
          curl -L -o color.caffemodel https://github.com/richzhang/colorization/raw/master/colorization/models/colorization_release_v2.caffemodel
          curl -L -o pts.npy https://github.com/richzhang/colorization/raw/master/colorization/resources/pts_in_hull.npy

      - name: 🎨 تشغيل محرك التلوين
        run: python colorize.py

      - name: 📤 حفظ النتيجة الملونة
        uses: actions/upload-artifact@v4
        with:
          name: Colorized_Manga_Result
          path: result.jpg
          if-no-files-found: warn

name: Auto Manga Colorizer Pro
on:
  push:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 سحب الكود والصور
        uses: actions/checkout@v4

      - name: 🐍 إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 تثبيت المكتبات وتجهيز بيئة العمل
        run: |
          python -m pip install --upgrade pip
          # تثبيت المكتبات من ملف requirements.txt
          pip install -r requirements.txt
          
          # تحميل كود المحرك يدوياً
          git clone https://github.com/jantic/DeOldify.git deoldify_code
          cp -r deoldify_code/deoldify .
          
          # إنشاء المجلدات التي يطلبها المحرك داخلياً لتجنب AssertionError
          mkdir -p dummy
          mkdir -p models

      - name: 🎨 تشغيل محرك التلوين الاحترافي
        # سيقوم المحرك الآن بتحميل ملف الأوزان وضعه في مجلد models الذي أنشأناه
        run: python colorize.py

      - name: 📤 حفظ النتيجة الملونة
        uses: actions/upload-artifact@v4
        with:
          name: Colorized_Manga_Result_Pro
          path: result.jpg
          if-no-files-found: error

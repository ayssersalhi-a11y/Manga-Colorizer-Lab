name: Auto Manga Colorizer
on:
  push:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: 📥 سحب الكود والصور
        uses: actions/checkout@v4

      - name: 🐍 إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 📦 تثبيت المكتبات اللازمة
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy

      - name: 📥 جلب ملفات الذكاء الاصطناعي (روابط Hugging Face المستقرة)
        run: |
          curl -L -o color.prototxt https://huggingface.co/MohamedLamoushi/MangaColorizerModels/resolve/main/colorization_deploy_v2.prototxt
          curl -L -o color.caffemodel https://huggingface.co/MohamedLamoushi/MangaColorizerModels/resolve/main/colorization_release_v2.caffemodel
          curl -L -o pts.npy https://huggingface.co/MohamedLamoushi/MangaColorizerModels/resolve/main/pts_in_hull.npy

      - name: 🎨 تشغيل محرك التلوين
        run: python colorize.py

      - name: 📤 حفظ النتيجة الملونة
        uses: actions/upload-artifact@v4
        with:
          name: Colorized_Manga_Result
          path: result.jpg
          if-no-files-found: warn

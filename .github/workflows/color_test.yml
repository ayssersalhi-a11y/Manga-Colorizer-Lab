name: Auto Manga Colorizer Pro
on:
  push:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: 📥 سحب الكود والصور
        uses: actions/checkout@v4

      - name: 🐍 إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip' # سيعمل الآن لأننا سنعتمد على requirements.txt

      - name: 📦 تثبيت المكتبات (الحل الالتفافي)
        run: |
          python -m pip install --upgrade pip
          # تثبيت المتطلبات من الملف أولاً
          pip install -r requirements.txt
          # تثبيت DeOldify يدوياً بدون تبعات لتجنب الأخطاء البرمجية داخل المكتبة
          pip install --no-deps git+https://github.com/jantic/DeOldify.git

      - name: 🎨 تشغيل محرك التلوين الاحترافي
        run: python colorize.py

      - name: 📤 حفظ النتيجة الملونة
        uses: actions/upload-artifact@v4
        with:
          name: Colorized_Manga_Result_Pro
          path: result.jpg
          if-no-files-found: warn

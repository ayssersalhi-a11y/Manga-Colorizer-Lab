name: Auto Manga Colorizer
on:
  push:
    # سيشتغل الأكسيون عند حدوث أي تغيير (Commit) في أي ملف داخل المستودع
  workflow_dispatch: # للتشغيل اليدوي دائماً متاح

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: 📥 سحب الكود والصور
        uses: actions/checkout@v4

      - name: 🐍 إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 📦 تثبيت المكتبات اللازمة
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy requests

      - name: 🎨 تشغيل محرك التلوين
        # هنا السكربت الذي وضعناه سابقاً سيبحث تلقائياً عن أي صورة موجودة
        run: python colorize.py

      - name: 📤 حفظ النتيجة الملونة
        uses: actions/upload-artifact@v4
        with:
          name: Colorized_Manga_Result
          path: result.jpg
          if-no-files-found: warn # لكي لا يفشل الأكسيون إذا لم يجد صورة، بل يعطي تحذيراً فقط

name: Auto Manga Colorizer
on:
  push:
    # سيشتغل عند أي تغيير في أي ملف بالمستودع (كود أو صور)
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: 📥 سحب الكود والصور
        uses: actions/checkout@v4

      - name: 🐍 إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 📦 تثبيت المكتبات اللازمة
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy

      - name: 📥 جلب ملفات الذكاء الاصطناعي (الروابط المجربة)
        run: |
          echo "جاري تحميل prototxt..."
          curl -L -o color.prototxt https://raw.githubusercontent.com/richzhang/colorization/caffe/colorization/models/colorization_deploy_v2.prototxt
          
          echo "جاري تحميل pts.npy..."
          curl -L -o pts.npy https://raw.githubusercontent.com/richzhang/colorization/caffe/colorization/resources/pts_in_hull.npy
          
          echo "جاري تحميل caffemodel (122MB)..."
          curl -L -o color.caffemodel https://storage.openvinotoolkit.org/repositories/datumaro/models/colorization/colorization_release_v2.caffemodel
          
          echo "تأكيد تحميل الملفات:"
          ls -lh

      - name: 🎨 تشغيل محرك التلوين
        run: python colorize.py

      - name: 📤 حفظ النتيجة الملونة
        uses: actions/upload-artifact@v4
        with:
          name: Colorized_Manga_Result
          path: result.jpg
          if-no-files-found: warn

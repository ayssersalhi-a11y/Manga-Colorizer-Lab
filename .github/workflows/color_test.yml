name: Auto Manga Colorizer Pro
on:
  push:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 سحب الكود والصور
        uses: actions/checkout@v4

      - name: 🐍 إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 تثبيت المكتبات الأساسية
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # تحميل كود DeOldify يدوياً وتجاهل التثبيت المكسور
          git clone https://github.com/jantic/DeOldify.git deoldify_code
          cp -r deoldify_code/deoldify .

      - name: 🎨 تشغيل محرك التلوين الاحترافي
        run: python colorize.py

      - name: 📤 حفظ النتيجة الملونة
        uses: actions/upload-artifact@v4
        with:
          name: Colorized_Manga_Result_Pro
          path: result.jpg

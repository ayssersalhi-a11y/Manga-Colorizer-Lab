name: Manga Colorize Test

on: 
  workflow_dispatch: # للتشغيل اليدوي

jobs:
  colorize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install OpenCV & Requirements
        run: pip install opencv-python numpy

      - name: Run Colorization Script
        run: python colorize.py

      - name: Upload Result Image
        uses: actions/upload-artifact@v4
        with:
          name: colored-result
          path: result.jpg

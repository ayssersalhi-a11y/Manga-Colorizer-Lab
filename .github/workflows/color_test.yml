name: Auto Manga Colorizer Pro
on:
  push:
    # سيشتغل عند أي تغيير في أي ملف بالمستودع
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: 📥 سحب الكود والصور
        uses: actions/checkout@v4

      - name: 🐍 إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip' # تسريع التثبيت في المرات القادمة

      - name: 📦 تثبيت المكتبات الثقيلة (DeOldify المحرك)
        run: |
          python -m pip install --upgrade pip
          # تثبيت المتطلبات الأساسية للنماذج المتقدمة
          pip install git+https://github.com/jantic/DeOldify.git fastai==2.7.15 numpy==1.24.4 pillow

      - name: 🎨 تشغيل محرك التلوين الاحترافي
        # هذا السطر سيشغل كود البايثون المطور الذي يستخدم DeOldify
        run: python colorize.py

      - name: 📤 حفظ النتيجة الملونة
        uses: actions/upload-artifact@v4
        with:
          name: Colorized_Manga_Result_Pro
          path: result.jpg
          if-no-files-found: warn
